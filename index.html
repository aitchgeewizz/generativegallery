<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Slower Stranger</title>
    <meta name="description" content="A slow museum-archive browser pulling real art and design from Cooper Hewitt, Harvard and the Art Institute of Chicago. A few unexpected pieces at a time." />

    <!-- Open Graph / LinkedIn / Twitter -->
    <meta property="og:title" content="Slower Stranger" />
    <meta property="og:description" content="Most design inspiration online is a firehose. This is the opposite. Real pieces from museum archives, served slowly. A break from the scroll." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://slowerstranger.com" />
    <meta property="og:image" content="https://slowerstranger.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Slower Stranger" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Slower Stranger" />
    <meta name="twitter:description" content="Most design inspiration online is a firehose. This is the opposite. Real pieces from museum archives, served slowly. A break from the scroll." />
    <meta name="twitter:image" content="https://slowerstranger.com/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://www.artic.edu" />
    <link rel="preconnect" href="https://collection.cooperhewitt.org" />
    <link rel="preconnect" href="https://api.harvardartmuseums.org" />

    <!-- Crimson Pro ExtraLight (200) trial — Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@200;300;400&display=swap" rel="stylesheet" />

    <style>
      /* Inline above-the-fold styles so the noscript fallback and the
         pre-hydration paint don't flash unstyled. Mirrors index.css. */
      body { margin: 0; background: #0a0a0a; color: rgba(255,255,255,0.92); font-family: 'Crimson Pro', -apple-system, BlinkMacSystemFont, serif; font-weight: 300; overflow: hidden; }
      .ns-wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2rem; }
      .ns-inner { max-width: 56rem; text-align: center; }
      .ns-title { font-size: clamp(2rem, 6vw, 4.5rem); line-height: 1.05; letter-spacing: -0.01em; text-transform: uppercase; margin: 0; }
      .ns-body { font-size: clamp(0.9rem, 1.5vw, 1.25rem); color: rgba(255,255,255,0.72); margin: 1.5rem 0 0; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Pre-hydration fallback. Mirrors the intro so crawlers and
           visitors with JS disabled still see the brand and thesis,
           not an empty page. Replaced by the React app as soon as
           main.tsx mounts. -->
      <noscript>
        <div class="ns-wrap">
          <div class="ns-inner">
            <h1 class="ns-title">SLOWER STRANGER</h1>
            <p class="ns-body">A few unexpected pieces of art and design we can appreciate and be inspired by. Not part of the algorithm but from those who came before us. Built with public museum APIs from the Art Institute of Chicago, Cooper Hewitt, and the Harvard Art Museums. Please enable JavaScript to explore the wall.</p>
          </div>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
